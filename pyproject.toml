[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelspaetzle"
version = "0.0.1"
description = "Process simulation of two-photon printed micro-optics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "nurbforge>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxelspaetzle = ["py.typed", "processes/*.json", "materials/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: expensive reference computation (pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Nurbforge re-exports its compiled core without __all__; its API is untyped (Any) here.
module = ["nurbforge", "nurbforge.*"]
implicit_reexport = true
